<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NO_TEXTURE_NETHER_3D</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', monospace;
    }

    #webgl-container {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Overlay Vignette et Lentille */
    .hud-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 25%, rgba(15, 0, 8, 0.9) 85%),
                  linear-gradient(rgba(255, 0, 255, 0.03) 50%, rgba(0, 0, 0, 0.3) 50%);
      background-size: 100% 100%, 100% 4px;
      box-shadow: inset 0 0 100px #000;
    }

    /* Interface Bouton Central */
    .ui-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .btn-reset {
      position: relative;
      padding: 24px 64px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffffff;
      text-transform: uppercase;
      border: 4px solid #000000;
      outline: none;
      cursor: pointer;
      background: conic-gradient(#ff00ff 90deg, #000000 90deg 180deg, #ff00ff 180deg 270deg, #000000 270deg);
      background-size: 32px 32px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000, 0 0 15px #ff00ff;
      box-shadow: 0 0 40px rgba(255, 0, 255, 0.9), inset 0 0 15px rgba(0, 0, 0, 0.9);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s;
    }

    .btn-reset:hover {
      transform: scale(1.12);
      box-shadow: 0 0 70px rgba(255, 0, 255, 1), 0 0 25px #ffffff;
      background-size: 16px 16px;
    }

    .btn-reset:active {
      transform: scale(0.92);
      filter: invert(1);
    }

    /* Effets de Glitch Extrêmes au Clic */
    body.corrupted #webgl-container {
      animation: gpuCrash 0.03s infinite;
      filter: invert(1) contrast(500%) saturate(800%);
    }

    body.corrupted .btn-reset {
      animation: btnCorrupt 0.02s infinite;
    }

    @keyframes gpuCrash {
      0% { transform: translate(18px, -12px) skewX(20deg); }
      25% { transform: translate(-20px, 15px) scaleY(1.2); }
      50% { transform: translate(12px, -18px) skewX(-25deg); }
      75% { transform: translate(-15px, 20px) scaleX(1.3); }
      100% { transform: translate(0, 0); }
    }

    @keyframes btnCorrupt {
      0% { transform: scale(1.4) rotate(12deg); color: #00ffff; background-size: 2px 80px; }
      50% { transform: scale(0.6) rotate(-12deg); color: #ff0000; background-size: 80px 2px; }
      100% { transform: scale(1.1) rotate(6deg); color: #00ff00; background-size: 10px 10px; }
    }

    /* Écran d'extinction CRT */
    .crt-screen-off {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #ffffff;
      z-index: 100;
      display: none;
      pointer-events: none;
    }

    .crt-screen-off.active {
      display: block;
      animation: collapseCRT 0.25s forwards ease-in;
    }

    @keyframes collapseCRT {
      0% { transform: scale(1, 1); filter: brightness(30); }
      50% { transform: scale(1, 0.002); background: #ff00ff; }
      100% { transform: scale(0, 0); background: #000; }
    }

    .fatal-error-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      background: #000000;
      z-index: 200;
      display: none;
      color: #ff00ff;
      padding: 40px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div id="webgl-container"></div>
  <div class="hud-overlay"></div>

  <div class="ui-container">
    <button class="btn-reset" id="resetBtn">RESET</button>
  </div>

  <div class="crt-screen-off" id="crt"></div>

  <div class="fatal-error-screen" id="terminal">
    [GPU_DRIVER_FATAL_COLLAPSE]<br>
    TEXTURE_MEMORY_OVERFLOW_AT_0x000000FF<br>
    STATUS: KERNEL_PANIC_RENDERER_DESTROYED<br><br>
    NO_TEXTURE_BUFFER_UNRECOVERABLE.<br>
    CLOSING HOST PROCESS...
  </div>

  <!-- Charger Three.js depuis CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // --------------------------------------------------
    // 1. INITIALISATION MOTEUR 3D
    // --------------------------------------------------
    const container = document.getElementById('webgl-container');

    const scene = new THREE.Scene();
    // Brouillard rouge/pourpre Nether
    scene.fog = new THREE.FogExp2(0x1a0008, 0.018);

    const camera = new THREE.PerspectiveCamera(80, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 16, 32);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // --------------------------------------------------
    // 2. GENERATEUR DE TEXTURE DAMIER NO-TEXTURE
    // --------------------------------------------------
    function createNoTextureMap() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      const size = 256;
      ctx.fillStyle = '#FF00FF'; // Magenta
      ctx.fillRect(0, 0, size, size);
      ctx.fillRect(size, size, size, size);

      ctx.fillStyle = '#000000'; // Noir
      ctx.fillRect(size, 0, size, size);
      ctx.fillRect(0, size, size, size);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.magFilter = THREE.NearestFilter; // Rendu pixelisé net style Minecraft/Source Engine
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const noTexture = createNoTextureMap();
    noTexture.repeat.set(50, 50);

    const noTextureMaterial = new THREE.MeshStandardMaterial({
      map: noTexture,
      roughness: 0.7,
      metalness: 0.15
    });
    // --------------------------------------------------
    // 3. TERRAIN 3D VOXEL / CANYON
    // --------------------------------------------------
    const geoWidth = 180;
    const geoHeight = 180;
    const terrainGeo = new THREE.PlaneGeometry(geoWidth, geoHeight, 100, 100);
    const pos = terrainGeo.attributes.position;

    // Relief en marches d'escaliers (Voxel)
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);

      let z = Math.sin(x * 0.06) * Math.cos(y * 0.06) * 14 + Math.cos(x * 0.03) * 12;
      z = Math.floor(z / 3) * 3; // Effet Voxel

      // Creuser un canyon central
      const distFromCenter = Math.abs(x);
      if (distFromCenter < 25) {
        z -= (25 - distFromCenter) * 0.6;
      }

      pos.setZ(i, z);
    }
    terrainGeo.computeVertexNormals();

    // Sol
    const terrain = new THREE.Mesh(terrainGeo, noTextureMaterial);
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    // Plafond (Caverne)
    const ceiling = new THREE.Mesh(terrainGeo, noTextureMaterial);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 38;
    scene.add(ceiling);

    // Piliers de stalagmites
    const pillarGeo = new THREE.BoxGeometry(8, 60, 8);
    const pillarCoords = [[-30, 10, -20], [35, 10, -35], [-15, 10, -60], [25, 10, 10]];

    pillarCoords.forEach(p => {
      const pillar = new THREE.Mesh(pillarGeo, noTextureMaterial);
      pillar.position.set(p[0], p[1], p[2]);
      scene.add(pillar);
    });

    // --------------------------------------------------
    // 4. ÉCLAIRAGE DYNAMIQUE
    // --------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xff00ff, 0.3);
    scene.add(ambientLight);

    // Lumière rouge vif au fond de la map
    const deepRedLight = new THREE.PointLight(0xff0033, 6, 140);
    deepRedLight.position.set(0, 5, -70);
    scene.add(deepRedLight);

    // Lumière violette sur le joueur
    const playerLight = new THREE.PointLight(0xff00ff, 3, 60);
    playerLight.position.set(0, 18, 25);
    scene.add(playerLight);
    // --------------------------------------------------
    // 5. BOUCLE DE RENDU & CONTRÔLES
    // --------------------------------------------------
    let time = 0;
    let isCorrupted = false;

    function animate() {
      requestAnimationFrame(animate);

      time += 0.005;

      if (!isCorrupted) {
        // Vol de caméra fluide style FPS Spectateur
        camera.position.x = Math.sin(time) * 10;
        camera.position.y = 16 + Math.cos(time * 1.4) * 2.5;
        camera.position.z = 32 + Math.sin(time * 0.3) * 4;
        camera.lookAt(0, -2, -25);

        // Défilement continu du damier
        noTexture.offset.y -= 0.002;
      } else {
        // Caméra folle pendant la corruption
        camera.position.x += (Math.random() - 0.5) * 8;
        camera.position.y += (Math.random() - 0.5) * 8;
        camera.rotation.z += (Math.random() - 0.5) * 0.4;
        noTexture.offset.x += Math.random() * 0.3;
        noTexture.offset.y += Math.random() * 0.3;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Redimensionnement de fenêtre
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
    // --------------------------------------------------
    // 6. SYNTHÉTISEUR AUDIO & CRASH SYSTEME
    // --------------------------------------------------
    function playUltraGlitchSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Oscillateur de fréquence montante
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(70, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(4000, audioCtx.currentTime + 1.8);
        gain.gain.setValueAtTime(0.5, audioCtx.currentTime);

        // Bruit blanc saturé
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const noiseGain = audioCtx.createGain();
        noiseGain.gain.setValueAtTime(0.6, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        noise.connect(noiseGain);
        noiseGain.connect(audioCtx.destination);

        osc.start();
        noise.start();
      } catch(e) {}
    }

    // Gestionnaire de Clic sur le bouton RESET
    const btn = document.getElementById('resetBtn');
    const crt = document.getElementById('crt');
    const terminal = document.getElementById('terminal');

    btn.addEventListener('click', () => {
      isCorrupted = true;
      document.body.classList.add('corrupted');
      btn.innerText = "FATAL_ERR";

      playUltraGlitchSound();

      // Extinction CRT après 1.6s
      setTimeout(() => {
        crt.classList.add('active');
      }, 1600);

      // Crash terminal final et fermeture après 2s
      setTimeout(() => {
        terminal.style.display = 'block';
        window.close(); // Tentative de fermer l'onglet
      }, 2000);
    });
  </script>
</body>
</html>
