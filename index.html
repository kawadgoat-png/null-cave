<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NO_TEXTURE_CORE_RENDERER</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
      font-family: 'Courier New', monospace;
    }

    #webgl-canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Effets de lentille et vignettage pro */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle, transparent 30%, rgba(10, 0, 5, 0.85) 85%, #000 100%);
      box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.9);
    }

    /* Bouton Central No Texture Ultra Stylisé */
    .ui-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
    }

    .btn-reset {
      position: relative;
      padding: 24px 64px;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffffff;
      text-transform: uppercase;
      border: 4px solid #000000;
      outline: none;
      cursor: pointer;
      background: conic-gradient(#ff00ff 90deg, #000000 90deg 180deg, #ff00ff 180deg 270deg, #000000 270deg);
      background-size: 32px 32px;
      text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000;
      box-shadow: 0 0 35px rgba(255, 0, 255, 0.9), 0 0 10px #000, inset 0 0 15px rgba(0,0,0,0.8);
      transition: transform 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.15s;
    }

    .btn-reset:hover {
      transform: scale(1.12);
      box-shadow: 0 0 60px rgba(255, 0, 255, 1), 0 0 25px rgba(255, 255, 255, 0.8);
      background-size: 16px 16px;
    }

    .btn-reset:active {
      transform: scale(0.92);
    }

    /* Effets de Glitch & Break de l'écran */
    body.corrupted #webgl-canvas {
      filter: invert(1) contrast(400%) saturate(500%);
      animation: screenGlitch 0.04s infinite;
    }

    body.corrupted .btn-reset {
      animation: btnCorrupt 0.03s infinite;
    }

    @keyframes screenGlitch {
      0% { transform: translate(12px, -8px) skewX(15deg); }
      25% { transform: translate(-15px, 10px) scaleY(1.08); }
      50% { transform: translate(8px, -12px) skewX(-20deg); }
      75% { transform: translate(-10px, 15px) scaleX(1.15); }
      100% { transform: translate(0, 0); }
    }

    @keyframes btnCorrupt {
      0% { transform: scale(1.3) rotate(5deg); color: #00ffff; background-size: 4px 60px; }
      50% { transform: scale(0.7) rotate(-8deg); color: #ff0000; background-size: 60px 4px; }
      100% { transform: scale(1.1) rotate(3deg); color: #00ff00; background-size: 12px 12px; }
    }

    /* Extinction CRT / Crash System */
    .crt-collapse {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 100;
      display: none;
      pointer-events: none;
    }

    .crt-collapse.active {
      display: block;
      animation: crtOff 0.3s forwards ease-out;
    }

    @keyframes crtOff {
      0% { transform: scale(1, 1); filter: brightness(20); }
      40% { transform: scale(1, 0.003); background: #ff00ff; }
      100% { transform: scale(0, 0); background: #000; }
    }

    .terminal-crash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 200;
      display: none;
      color: #ff00ff;
      padding: 30px;
      font-size: 1rem;
      line-height: 1.5;
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>
  <div class="vignette-overlay"></div>

  <div class="ui-layer">
    <button class="btn-reset" id="resetBtn">RESET</button>
  </div>

  <div class="crt-collapse" id="crt"></div>

  <div class="terminal-crash" id="terminal">
    [CRITICAL_ENGINE_FAILURE]<br>
    ENGINE_STATUS: RENDERER_LOST<br>
    ERROR_CODE: 0x887A0005 (DEVICE_REMOVED)<br><br>
    UNABLE TO RECOVER TEXTURE_MEMORY_POOL.<br>
    HALTING PROCESS.
  </div>

  <script>
    // --------------------------------------------------
    // 1. INITIALISATION SCÈNE & RENDU WEBGL
    // --------------------------------------------------
    const canvas = document.getElementById('webgl-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const scene = new THREE.Scene();

    // Brouillard atmosphérique sombre/rouge dans le fond
    scene.fog = new THREE.FogExp2(0x1a000d, 0.018);

    const camera = new THREE.PerspectiveCamera(85, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 18, 35);

    // --------------------------------------------------
    // 2. GENERATION DE LA TEXTURE DAMIER HAUTE PRÉCISION
    // --------------------------------------------------
    function generateCheckerTexture() {
      const size = 512;
      const texCanvas = document.createElement('canvas');
      texCanvas.width = size;
      texCanvas.height = size;
      const ctx = texCanvas.getContext('2d');

      const half = size / 2;
      ctx.fillStyle = '#FF00FF'; // Magenta Missing Texture
      ctx.fillRect(0, 0, half, half);
      ctx.fillRect(half, half, half, half);

      ctx.fillStyle = '#000000'; // Black
      ctx.fillRect(half, 0, half, half);
      ctx.fillRect(0, half, half, half);

      const texture = new THREE.CanvasTexture(texCanvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      texture.magFilter = THREE.NearestFilter; // Pixel Perfect sans flou
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const checkerTexture = generateCheckerTexture();
    checkerTexture.repeat.set(60, 60);

    // Material réactif à la lumière
    const checkerMaterial = new THREE.MeshStandardMaterial({
      map: checkerTexture,
      roughness: 0.7,
      metalness: 0.1,
    });

    // --------------------------------------------------
    // 3. GENERATION DU TERRAIN 3D TYPE VOXEL / CAVERNE
    // --------------------------------------------------
    const geoWidth = 160;
    const geoHeight = 160;
    const geometry = new THREE.PlaneGeometry(geoWidth, geoHeight, 120, 120);
    const pos = geometry.attributes.position;

    // Algorithme de relief style "Minecraft / Source Engine Canyon"
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const y = pos.getY(i);

      // Quantification pour créer des blocs / falaises abruptes
      let z = Math.sin(x * 0.08) * Math.cos(y * 0.08) * 12 + Math.cos(x * 0.04) * 15;
      
      // Marches d'escaliers (effet Voxel)
      z = Math.floor(z / 3) * 3;

      // Gouffre au centre
      const distFromCenter = Math.sqrt(x*x + y*y);
      if(distFromCenter < 30) {
        z -= (30 - distFromCenter) * 0.8;
      }

      pos.setZ(i, z);
    }
    geometry.computeVertexNormals();

    // Sol
    const terrain = new THREE.Mesh(geometry, checkerMaterial);
    terrain.rotation.x = -Math.PI / 2;
    scene.add(terrain);

    // Plafond (Caverne fermée)
    const ceiling = new THREE.Mesh(geometry, checkerMaterial);
    ceiling.rotation.x = Math.PI / 2;
    ceiling.position.y = 40;
    scene.add(ceiling);

    // Piliers géants dans le décor
    const pillarGeo = new THREE.BoxGeometry(6, 60, 6);
    const pillarPositions = [[-25, 10, -20], [30, 10, -30], [-10, 10, -50], [20, 10, 10]];

    pillarPositions.forEach(p => {
      const pillar = new THREE.Mesh(pillarGeo, checkerMaterial);
      pillar.position.set(p[0], p[1], p[2]);
      scene.add(pillar);
    });

    // --------------------------------------------------
    // 4. ÉCLAIRAGE DRAMATIQUE ET AMBIANCE
    // --------------------------------------------------
    const ambientLight = new THREE.AmbientLight(0xff00ff, 0.25);
    scene.add(ambientLight);

    // Lumière rouge sombre dans le fond (exactement comme sur l'image)
    const deepRedLight = new THREE.PointLight(0xff0033, 5, 120);
    deepRedLight.position.set(0, 5, -60);
    scene.add(deepRedLight);

    // Lumière violette qui suit légèrement la caméra
    const playerLight = new THREE.PointLight(0xff00ff, 3, 50);
    playerLight.position.set(0, 20, 30);
    scene.add(playerLight);

    // --------------------------------------------------
    // 5. ANIMATION DE LA CAMÉRA & SHADER GLITCH
    // --------------------------------------------------
    let clock = new THREE.Clock();
    let isGlitching = false;

    function animate() {
      requestAnimationFrame(animate);

      const elapsedTime = clock.getElapsedTime();

      if (!isGlitching) {
        // Mouvement panoramique réaliste (style vue joueur)
        camera.position.x = Math.sin(elapsedTime * 0.3) * 12;
        camera.position.y = 18 + Math.cos(elapsedTime * 0.5) * 2;
        camera.position.z = 35 + Math.sin(elapsedTime * 0.2) * 5;
        camera.lookAt(0, -2, -20);

        // Déplacement lent du texture mapping pour simuler un mouvement
        checkerTexture.offset.y = elapsedTime * 0.02;
      } else {
        // Corruption violent des coordonnées et de la caméra
        camera.position.x += (Math.random() - 0.5) * 8;
        camera.position.y += (Math.random() - 0.5) * 8;
        camera.rotation.z += (Math.random() - 0.5) * 0.5;
        checkerTexture.offset.x += Math.random() * 0.2;
        checkerTexture.offset.y += Math.random() * 0.2;
      }

      renderer.render(scene, camera);
    }

    animate();

    // Responsive
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --------------------------------------------------
    // 6. LOGIQUE DE DESTRUCTION DU SYSTEME
    // --------------------------------------------------
    const btn = document.getElementById('resetBtn');
    const crt = document.getElementById('crt');
    const terminal = document.getElementById('terminal');

    function playAudioGlitch() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Generateur de bruit blanc saturé
        const bufferSize = audioCtx.sampleRate * 2;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;

        // Gain fort
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.8, audioCtx.currentTime);

        noise.connect(gain);
        gain.connect(audioCtx.destination);

        noise.start();
      } catch(e) {}
    }

    btn.addEventListener('click', () => {
      isGlitching = true;
      document.body.classList.add('corrupted');
      btn.innerText = "0x000000";

      playAudioGlitch();

      // Crash de la page étape par étape
      setTimeout(() => {
        crt.classList.add('active');
      }, 1800);

      setTimeout(() => {
        terminal.style.display = 'block';
        window.close(); // Fermeture de la page
      }, 2200);
    });
  </script>
</body>
</html>
